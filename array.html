<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Font Dictionary Builder Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1e1e1e; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            display: flex; 
            gap: 30px; 
            max-width: 1000px; 
            width: 100%; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        .editor-panel { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #2d2d2d; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            max-width: 450px;
        }
        .char-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 20px;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .char-btn {
            width: 32px;
            height: 32px;
            background: #333;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .char-btn:hover { background: #555; color: white; }
        .char-btn.active { 
            background: #5865F2; 
            color: white; 
            border-color: #5865F2; 
            box-shadow: 0 0 5px #5865F2;
        }
        .char-btn.saved {
            border-bottom: 4px solid #10B981;
            color: white;
        }
        .header-input { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 15px; 
            width: 100%;
            justify-content: space-between;
        }
        .header-input input { 
            width: 45px; 
            height: 45px; 
            font-size: 22px; 
            text-align: center; 
            font-weight: bold; 
            text-transform: uppercase; 
            border: 2px solid #5865F2; 
            border-radius: 6px; 
            background: #111; 
            color: #fff; 
        }
        .toolbar {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .tool-btn {
            flex: 1;
            padding: 8px;
            background: #444;
            color: #ccc;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tool-btn:hover { background: #555; color: white; }
        .tool-btn:active { background: #333; }
        .grid { 
            display: grid; 
            gap: 2px; 
            background: #444; 
            padding: 2px; 
            border-radius: 4px; 
            margin-bottom: 20px; 
            user-select: none; 
        }
        .cell { 
            width: 40px; 
            height: 40px; 
            background: #222; 
            cursor: pointer; 
            transition: 0.1s; 
            border-radius: 2px; 
        }
        .cell.active { 
            background: #5865F2; 
            box-shadow: 0 0 5px #5865F2; 
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
        }
        button.action-btn { 
            flex: 1; 
            padding: 12px; 
            cursor: pointer; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: 0.2s; 
        }
        .clear-btn { background: #E0245E; }
        .clear-btn:hover { background: #be1e4d; }
        .save-btn { background: #10B981; }
        .save-btn:hover { background: #059669; }
        .output-panel { 
            flex: 1; 
            min-width: 300px; 
            display: flex; 
            flex-direction: column; 
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h3 { margin-top: 0; border-bottom: 2px solid #444; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .copy-btn {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #4338ca; }
        textarea { 
            flex: 1; 
            width: 100%; 
            min-height: 400px; 
            background: #111; 
            color: #10B981; 
            padding: 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            font-size: 14px; 
            border: 1px solid #444; 
            resize: none; 
            white-space: pre; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2 style="margin-top: 0;">🛠️ Pixel Font Dictionary Pro</h2>
    
    <div class="container">
        <div class="editor-panel">
            <div class="char-menu" id="charMenu"></div>
            <div class="header-input">
                <span style="font-size: 14px; color: #aaa;">Target Huruf:</span>
                <input type="text" id="charTarget" maxlength="1" value="A">
            </div>
            <div class="toolbar">
                <button class="tool-btn" onclick="undo()" title="Shortcut: Ctrl + Z">↩️ Undo</button>
                <button class="tool-btn" onclick="redo()" title="Shortcut: Ctrl + Y">↪️ Redo</button>
            </div>
            <div class="grid" id="pixelGrid" style="grid-template-columns: repeat(5, 40px);"></div>
            <div class="btn-group">
                <button class="action-btn clear-btn" onclick="clearGrid()">Bersihkan</button>
                <button class="action-btn save-btn" onclick="saveChar()">Simpan ke Kamus ➔</button>
            </div>
        </div>

        <div class="output-panel">
            <h3>
                Hasil Kamus
                <button class="copy-btn" onclick="copyCode()" id="copyBtn">📋 Copy Code</button>
            </h3>
            <textarea id="outputCode" readonly>const fontDict = {
};</textarea>
        </div>
    </div>

<script>
    const width = 5;
    const height = 5;
    const grid = document.getElementById('pixelGrid');
    const charTarget = document.getElementById('charTarget');
    const output = document.getElementById('outputCode');
    const charMenu = document.getElementById('charMenu');
    
    let fontDictionary = {};

    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!? ".split('');
    characters.forEach(char => {
        let btn = document.createElement('button');
        btn.className = 'char-btn';
        btn.innerText = char === ' ' ? '␣' : char;
        btn.dataset.char = char;
        
        btn.onclick = () => {
            charTarget.value = char;
            charTarget.dispatchEvent(new Event('input'));
        };
        charMenu.appendChild(btn);
    });

    let undoStack = [];
    let redoStack = [];

    function getCurrentGridState() {
        const cells = document.querySelectorAll('.cell');
        return Array.from(cells).map(c => c.classList.contains('active') ? '1' : '0').join('');
    }

    function setGridState(stateStr) {
        const cells = document.querySelectorAll('.cell');
        for(let i = 0; i < stateStr.length; i++) {
            if(stateStr[i] === '1') cells[i].classList.add('active');
            else cells[i].classList.remove('active');
        }
    }

    function saveState() {
        const currentState = getCurrentGridState();
        if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== currentState) {
            undoStack.push(currentState);
            redoStack = []; 
        }
    }

    function undo() {
        if (undoStack.length > 0) {
            redoStack.push(getCurrentGridState());
            const prevState = undoStack.pop();
            setGridState(prevState);
        }
    }

    function redo() {
        if (redoStack.length > 0) {
            undoStack.push(getCurrentGridState());
            const nextState = redoStack.pop();
            setGridState(nextState);
        }
    }

    document.addEventListener('keydown', (e) => {
        if(document.activeElement === charTarget) return; 

        if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
            e.preventDefault(); undo();
        } else if ((e.ctrlKey && e.key.toLowerCase() === 'y') || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z')) {
            e.preventDefault(); redo();
        }
    });

    for (let i = 0; i < width * height; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        cell.addEventListener('mousedown', (e) => {
            saveState(); 
            togglePixel(e);
        });
        cell.addEventListener('mouseenter', (e) => {
            if (e.buttons === 1) togglePixel(e);
        });
        grid.appendChild(cell);
    }

    function togglePixel(e) { e.target.classList.toggle('active'); }

    function clearGrid() {
        saveState(); 
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    }

    function getGridArray() {
        const cells = document.querySelectorAll('.cell');
        let rawArr = [];
        let minCol = width; 
        let maxCol = -1;    

        for (let y = 0; y < height; y++) {
            let rowStr = "";
            for (let x = 0; x < width; x++) {
                const index = y * width + x;
                const val = cells[index].classList.contains('active') ? '1' : '0';
                rowStr += val;
                if (val === '1') {
                    if (x < minCol) minCol = x;
                    if (x > maxCol) maxCol = x;
                }
            }
            rawArr.push(rowStr);
        }

        if (maxCol === -1) return rawArr.map(() => '00'); 
        return rawArr.map(row => row.substring(minCol, maxCol + 1));
    }

    function loadGridArray(arr) {
        const cells = document.querySelectorAll('.cell');
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const index = y * width + x;
                if (arr[y] && x < arr[y].length && arr[y][x] === '1') {
                    cells[index].classList.add('active');
                } else {
                    cells[index].classList.remove('active');
                }
            }
        }
    }

    charTarget.addEventListener('input', () => {
        let char = charTarget.value.toUpperCase();
        charTarget.value = char; 
        
        document.querySelectorAll('.char-btn').forEach(btn => {
            if (btn.dataset.char === char) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        undoStack = [];
        redoStack = [];

        if (fontDictionary[char]) {
            loadGridArray(fontDictionary[char]);
        } else {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
        }
    });

    function saveChar() {
        let char = charTarget.value.toUpperCase();
        if (!char) return;

        fontDictionary[char] = getGridArray();
        updateOutput();
        
        document.querySelectorAll('.char-btn').forEach(btn => {
            if (btn.dataset.char === char) btn.classList.add('saved');
        });

        const btn = document.querySelector('.save-btn');
        const oldText = btn.innerText;
        btn.innerText = "Tersimpan! ✔️";
        btn.style.background = "#047857";
        setTimeout(() => {
            btn.innerText = oldText;
            btn.style.background = "#10B981";
        }, 1000);

        const currentIndex = characters.indexOf(char);
        
        if (currentIndex !== -1 && currentIndex < characters.length - 1) {
            const nextChar = characters[currentIndex + 1];
            
            setTimeout(() => {
                charTarget.value = nextChar;
                charTarget.dispatchEvent(new Event('input'));
            }, 400); 
        }
    }

    function updateOutput() {
        let finalCode = "const fontDict = {\n";
        const keys = Object.keys(fontDictionary).sort(); 
        
        for (let i = 0; i < keys.length; i++) {
            const k = keys[i];
            const arr = fontDictionary[k];
            const arrStr = arr.map(row => `'${row}'`).join(', ');
            finalCode += `    '${k}': [${arrStr}]`;
            if (i < keys.length - 1) finalCode += ",\n";
            else finalCode += "\n";
        }
        
        finalCode += "\n};";
        output.value = finalCode;
    }

    function copyCode() {
        output.select();
        output.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(output.value).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "✔️ Tersalin!";
            copyBtn.style.background = "#10B981";
            setTimeout(() => {
                copyBtn.innerText = "📋 Copy Code";
                copyBtn.style.background = "#4F46E5";
            }, 2000);
        }).catch(err => {
            alert('Gagal menyalin teks.');
        });
    }

    charTarget.dispatchEvent(new Event('input'));
</script>

</body>
</html>
