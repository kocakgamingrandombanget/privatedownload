<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Documentations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-base: #050505; --bg-surface: #0a0a0a; --bg-card: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08); --border-highlight: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff; --text-secondary: #a1a1aa; --text-muted: #71717a;
            --accent-primary: #8b5cf6; --accent-success: #10b981; --accent-danger: #f43f5e; --accent-admin: #f59e0b; 
            --gradient-master: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-primary); line-height: 1.5; }
        h1, h2, h3, h4, .font-outfit { font-family: 'Outfit', sans-serif; }
        .text-admin { background: var(--gradient-master); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0 1rem; min-height: 2.5rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; border: none; cursor: pointer; color: white; transition: all 0.2s; }
        .btn-master { background: var(--gradient-master); border: 1px solid rgba(255,255,255,0.1); }
        .btn-master:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: var(--border-highlight); }
        .btn-danger { background: rgba(244, 63, 94, 0.1); color: var(--accent-danger); border: 1px solid rgba(244, 63, 94, 0.3); }
        .btn-danger:hover { background: rgba(244, 63, 94, 0.2); }
        .w-full { width: 100%; }

        .btn-icon { width: 2rem; height: 2rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--border-highlight); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.05); }
        .btn-icon:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; border-color: var(--accent-admin); }
        .btn-icon:disabled { cursor: not-allowed; border-color: transparent; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.3rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; padding: 0.75rem 1rem; background: rgba(0,0,0,0.4); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text-primary); font-size: 0.85rem; outline: none; font-family: inherit; }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-admin); box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15); }
        textarea { min-height: 150px; resize: vertical; }
        select option { background: var(--bg-surface); color: white; }

        .auth-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1.25rem; min-height: 100vh; }
        .auth-container { max-width: 24rem; width: 100%; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 12px; padding: 2rem 1.75rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-top: 3px solid var(--accent-admin); }
        
        .dashboard-wrapper { display: none; padding: 2rem; max-width: 90rem; margin: 0 auto; }
        .dashboard-wrapper.active { display: block; animation: fadeIn 0.4s ease; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border-light); padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; vertical-align: middle; }
        th { color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; background: rgba(255,255,255,0.02); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: rgba(16, 185, 129, 0.95); color: #fff; padding: 1rem; border-radius: 8px; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 999; border: 1px solid rgba(255,255,255,0.2); font-weight: 500; font-size: 0.85rem; }
        .toast.show { transform: translateY(0); opacity: 1; }

        .cat-group { background: rgba(245, 158, 11, 0.05); border: 1px dashed rgba(245, 158, 11, 0.3); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="auth-wrapper" id="auth-section">
        <div class="auth-container">
            <h1 class="font-outfit text-admin" style="text-align: center; margin-bottom: 0.25rem;">Docs Master Panel</h1>
            <p style="text-align:center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.85rem;">Authentication required.</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Master Password</label>
                    <input type="password" id="admin-key" required placeholder="Enter admin password">
                </div>
                <button type="submit" class="btn btn-master w-full" id="btn-login"><i class="fa-solid fa-unlock-keyhole"></i> Authenticate</button>
            </form>
        </div>
    </div>

    <div class="dashboard-wrapper" id="dashboard-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 class="font-outfit text-admin"><i class="fa-solid fa-book-open"></i> Docs Manager</h1>
            <button onclick="logout()" class="btn btn-outline" style="min-height: 2rem; padding: 0 1rem;"><i class="fa-solid fa-right-from-bracket"></i> Lock Console</button>
        </div>

        <div class="card">
            <h2 class="font-outfit" id="form-title" style="margin-bottom: 1.5rem; color: #fff;">Add New Document</h2>
            <input type="hidden" id="doc-id">
            
            <div class="cat-group">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--accent-admin);"><i class="fa-solid fa-layer-group"></i> Pilih Kategori yang Sudah Ada (Otomatis Isi)</label>
                    <select id="existing-cat" onchange="populateCategoryFields()" style="background: rgba(0,0,0,0.6); border-color: rgba(245, 158, 11, 0.4);">
                        <option value="">-- Kategori Baru (Ketik Manual di Bawah) --</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group"><label>Category (EN)</label><input type="text" id="cat-en" placeholder="e.g. Getting Started"></div>
                    <div class="form-group"><label>Kategori (ID)</label><input type="text" id="cat-id" placeholder="Contoh: Persiapan Awal"></div>
                    <div class="form-group"><label>Urutan Kategori</label><input type="number" id="cat-order" value="1" placeholder="1"></div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1.5rem;">
                <div class="form-group" style="grid-column: span 2;"><label>Title (EN)</label><input type="text" id="title-en" placeholder="Document Title"></div>
                <div class="form-group"><label>Urutan Artikel (Di dalam kategori)</label><input type="number" id="doc-order" value="1"></div>
            </div>
            <div class="form-group"><label>Judul (ID)</label><input type="text" id="title-id" placeholder="Judul Dokumen"></div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                <div class="form-group"><label>Content (EN) - HTML Supported</label><textarea id="content-en" placeholder="<p>Write your english content here...</p>"></textarea></div>
                <div class="form-group"><label>Konten (ID) - HTML Supported</label><textarea id="content-id" placeholder="<p>Tulis konten indonesia di sini...</p>"></textarea></div>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button onclick="saveDoc()" class="btn btn-master"><i class="fa-solid fa-floppy-disk"></i> Save Document</button>
                <button onclick="resetForm()" class="btn btn-outline">Cancel / Reset</button>
            </div>
        </div>

        <div class="card">
            <h2 class="font-outfit" style="margin-bottom: 1rem; color: #fff;">Documents List (Auto Sorted)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr>
                        <th>Category Info</th>
                        <th style="text-align:center;">Order Category</th>
                        <th>Document Title</th>
                        <th style="text-align:center;">Order Doc</th>
                        <th style="text-align: right;">Action</th>
                    </tr></thead>
                    <tbody id="docs-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzOAHFZyhAd4h8lpWi1lCB4j94iio5Yu-_qf5XYHUP2dxDBlMfr0_h-wBCdsE4p56yL/exec";
        let allDocs = [];

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...'; btn.disabled = true;
            
            const pass = document.getElementById('admin-key').value.trim();
            fetch(WEB_APP_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "admin_login", adminPassword: pass })
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    sessionStorage.setItem('docs_admin', pass);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('dashboard-section').classList.add('active');
                    loadDocs();
                    showToast('Access Granted');
                } else alert(res.message);
            }).finally(() => { btn.innerHTML = '<i class="fa-solid fa-unlock-keyhole"></i> Authenticate'; btn.disabled = false; });
        });

        function logout() { sessionStorage.removeItem('docs_admin'); location.reload(); }

        function loadDocs() {
            fetch(WEB_APP_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "get_docs" })
            }).then(r => r.json()).then(data => {
                if(data.status === "success") { 
                    allDocs = data.docs; 
                    renderTable(); 
                    updateCategoryDropdown();
                }
            });
        }

        function updateCategoryDropdown() {
            const select = document.getElementById("existing-cat");
            select.innerHTML = '<option value="">-- Buat Kategori Baru (Ketik Manual di Bawah) --</option>';
            
            const uniqueCats = [];
            allDocs.forEach(d => {
                if(!uniqueCats.some(c => c.en === d.catEn)) {
                    uniqueCats.push({ en: d.catEn, id: d.catId, order: d.catOrder || 1 });
                }
            });
            
            window.cachedCats = uniqueCats;
            uniqueCats.forEach(c => {
                select.innerHTML += `<option value="${c.en}">${c.en} / ${c.id} (Urutan: ${c.order})</option>`;
            });
        }

        function populateCategoryFields() {
            const val = document.getElementById("existing-cat").value;
            if(!val) {
                document.getElementById("cat-en").value = "";
                document.getElementById("cat-id").value = "";
                document.getElementById("cat-order").value = "1";
                return;
            }
            const cat = window.cachedCats.find(c => c.en === val);
            if(cat) {
                document.getElementById("cat-en").value = cat.en;
                document.getElementById("cat-id").value = cat.id;
                document.getElementById("cat-order").value = cat.order;
                
                // Cari urutan dokumen terakhir di kategori ini + 1
                let docsInCat = allDocs.filter(d => d.catEn === cat.en);
                let maxOrder = 0;
                docsInCat.forEach(d => { if(d.order > maxOrder) maxOrder = d.order; });
                document.getElementById("doc-order").value = maxOrder + 1;
            }
        }

        function renderTable() {
            const tbody = document.getElementById("docs-tbody");
            tbody.innerHTML = "";
            
            let uniqueCats = [...new Set(allDocs.map(x => x.catEn))];

            allDocs.forEach(d => {
                let docsInCat = allDocs.filter(x => x.catEn === d.catEn);
                let isFirstInCat = docsInCat[0].id === d.id;
                let isLastInCat = docsInCat[docsInCat.length - 1].id === d.id;

                let isFirstCat = uniqueCats[0] === d.catEn;
                let isLastCat = uniqueCats[uniqueCats.length - 1] === d.catEn;

                tbody.innerHTML += `<tr>
                    <td>
                        <span style="color:#fff; font-weight: 500;">${d.catEn}</span> <br> 
                        <span style="color:var(--text-muted); font-size: 0.75rem;">${d.catId}</span>
                    </td>
                    <td style="white-space: nowrap; text-align:center;">
                        <button onclick="moveCat('${d.catEn}', -1)" class="btn-icon" ${isFirstCat ? 'disabled style="opacity:0.2"' : ''} title="Naikkan Kategori"><i class="fa-solid fa-arrow-up"></i></button>
                        <button onclick="moveCat('${d.catEn}', 1)" class="btn-icon" ${isLastCat ? 'disabled style="opacity:0.2"' : ''} title="Turunkan Kategori"><i class="fa-solid fa-arrow-down"></i></button>
                    </td>
                    <td>
                        ${d.titleEn} <br> <span style="color:var(--text-muted); font-size: 0.75rem;">${d.titleId}</span>
                    </td>
                    <td style="white-space: nowrap; text-align:center;">
                        <button onclick="moveDoc('${d.id}', -1)" class="btn-icon" ${isFirstInCat ? 'disabled style="opacity:0.2"' : ''} title="Naikkan Artikel"><i class="fa-solid fa-arrow-up"></i></button>
                        <button onclick="moveDoc('${d.id}', 1)" class="btn-icon" ${isLastInCat ? 'disabled style="opacity:0.2"' : ''} title="Turunkan Artikel"><i class="fa-solid fa-arrow-down"></i></button>
                    </td>
                    <td style="text-align: right; white-space: nowrap;">
                        <button onclick="editDoc('${d.id}')" class="btn btn-outline" style="min-height: 2rem; padding: 0 0.75rem; font-size: 0.75rem;"><i class="fa-solid fa-pen"></i> Edit</button>
                        <button onclick="deleteDoc('${d.id}')" class="btn btn-danger" style="min-height: 2rem; padding: 0 0.75rem; font-size: 0.75rem;"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>`;
            });
        }

        // ==========================================
        // FITUR PINDAH URUTAN VIA TOMBOL PANAH
        // ==========================================
        function moveCat(catEn, direction) {
            let uniqueCats = [];
            allDocs.forEach(d => { if(!uniqueCats.some(c => c.en === d.catEn)) uniqueCats.push({en: d.catEn, order: d.catOrder || 1}); });
            
            let idx = uniqueCats.findIndex(c => c.en === catEn);
            if (idx === -1) return;
            let targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= uniqueCats.length) return;

            let temp = uniqueCats[idx].order;
            uniqueCats[idx].order = uniqueCats[targetIdx].order;
            uniqueCats[targetIdx].order = temp;

            if (uniqueCats[idx].order === uniqueCats[targetIdx].order) {
                uniqueCats[idx].order += direction;
                uniqueCats[targetIdx].order -= direction;
            }

            let updates = [];
            allDocs.forEach(d => {
                if (d.catEn === uniqueCats[idx].en) updates.push({id: d.id, catOrder: uniqueCats[idx].order, order: d.order});
                else if (d.catEn === uniqueCats[targetIdx].en) updates.push({id: d.id, catOrder: uniqueCats[targetIdx].order, order: d.order});
            });
            sendOrderUpdates(updates);
        }

        function moveDoc(docId, direction) {
            let doc = allDocs.find(d => d.id === docId);
            let docsInCat = allDocs.filter(d => d.catEn === doc.catEn);
            let idx = docsInCat.findIndex(d => d.id === docId);
            
            let targetIdx = idx + direction;
            if(targetIdx < 0 || targetIdx >= docsInCat.length) return;
            let targetDoc = docsInCat[targetIdx];

            let temp = doc.order;
            doc.order = targetDoc.order;
            targetDoc.order = temp;

            if (doc.order === targetDoc.order) {
                doc.order += direction;
                targetDoc.order -= direction;
            }

            let updates = [
                {id: doc.id, catOrder: doc.catOrder, order: doc.order},
                {id: targetDoc.id, catOrder: targetDoc.catOrder, order: targetDoc.order}
            ];
            sendOrderUpdates(updates);
        }

        function sendOrderUpdates(updates) {
            const pass = sessionStorage.getItem('docs_admin');
            if(!pass) return logout();

            // Optimistic Update UI (Biar kerasa cepat & responsif di mata user)
            updates.forEach(u => {
                let d = allDocs.find(x => x.id === u.id);
                if(d) { d.catOrder = u.catOrder; d.order = u.order; }
            });
            allDocs.sort((a, b) => {
                if(a.catOrder !== b.catOrder) return a.catOrder - b.catOrder;
                return a.order - b.order;
            });
            renderTable();

            // Background Request
            fetch(WEB_APP_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "admin_update_orders", adminPassword: pass, updates: updates })
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') { allDocs = res.docs; updateCategoryDropdown(); } 
                else { alert('Gagal mengurutkan: ' + res.message); loadDocs(); }
            });
        }
        // ==========================================

        function saveDoc() {
            const pass = sessionStorage.getItem('docs_admin');
            if(!pass) return logout();
            
            const payload = {
                action: document.getElementById('doc-id').value ? "admin_edit_doc" : "admin_add_doc",
                adminPassword: pass,
                docId: document.getElementById('doc-id').value,
                catEn: document.getElementById('cat-en').value, 
                catId: document.getElementById('cat-id').value,
                catOrder: parseInt(document.getElementById('cat-order').value) || 1,
                titleEn: document.getElementById('title-en').value, 
                titleId: document.getElementById('title-id').value,
                contentEn: document.getElementById('content-en').value, 
                contentId: document.getElementById('content-id').value,
                order: parseInt(document.getElementById('doc-order').value) || 1
            };

            fetch(WEB_APP_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') { showToast('Document saved successfully!'); resetForm(); loadDocs(); } 
                else alert('Error: ' + res.message);
            });
        }

        function editDoc(id) {
            const doc = allDocs.find(d => d.id === id);
            if(doc) {
                document.getElementById('form-title').innerText = "Edit Document";
                document.getElementById('doc-id').value = doc.id;
                document.getElementById('existing-cat').value = doc.catEn; 
                
                document.getElementById('cat-en').value = doc.catEn; 
                document.getElementById('cat-id').value = doc.catId;
                document.getElementById('cat-order').value = doc.catOrder || 1;
                
                document.getElementById('title-en').value = doc.titleEn; 
                document.getElementById('title-id').value = doc.titleId;
                document.getElementById('content-en').value = doc.contentEn; 
                document.getElementById('content-id').value = doc.contentId;
                
                document.getElementById('doc-order').value = doc.order || 1;
                window.scrollTo(0,0);
            }
        }

        function deleteDoc(id) {
            const pass = sessionStorage.getItem('docs_admin');
            if(!confirm('Are you sure you want to delete this document?')) return;
            fetch(WEB_APP_URL, {
                method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "admin_delete_doc", adminPassword: pass, docId: id })
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') { showToast('Document deleted!'); loadDocs(); } 
                else alert('Error: ' + res.message);
            });
        }

        function resetForm() {
            document.getElementById('form-title').innerText = "Add New Document";
            document.getElementById('doc-id').value = "";
            document.getElementById('existing-cat').value = "";
            document.getElementById('cat-en').value = ""; document.getElementById('cat-id').value = "";
            document.getElementById('cat-order').value = "1";
            document.getElementById('title-en').value = ""; document.getElementById('title-id').value = "";
            document.getElementById('content-en').value = ""; document.getElementById('content-id').value = "";
            document.getElementById('doc-order').value = "1";
        }

        if(sessionStorage.getItem('docs_admin')) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard-section').classList.add('active');
            loadDocs();
        }
    </script>
</body>
</html>
